 if(!l.length){toast("No questions here yet. Answer some first.");return}
 if(DB.sh!==false)l=shuf(l);
 const name=sets().find(s=>s[0]===p)[2],lim=DB.cd!==false?(/^\d$/.test(p)?PT[p]*60:p==="all"?PT.reduce((a,b)=>a+b,0)*60:l.length*60):0;
 S={name,ids:l.map(q=>q.id),i:0,ans:{},sc:0,el:0,lim};DB.cur=S;save();go("quiz")}
/* QUIZ */
function quiz(){
 if(!S){if(DB.cur&&DB.cur.i<DB.cur.ids.length)S=DB.cur;else return go("practice")}
 draw();startT()}
function tick(){const e=$("#tmr");if(!e)return;const rem=S.lim-S.el;e.innerHTML=ic("clock",18)+(S.lim?fmt(rem):fmt(S.el));e.classList.toggle("low",!!S.lim&&rem<60)}
let LT=0;
function startT(){stop();LT=Date.now();TM=setInterval(()=>{const n=Date.now();S.el+=Math.min((n-LT)/1000,2);LT=n;tick();DB.cur=S;save();if(S.lim&&S.el>=S.lim)finish()},1000)}
document.addEventListener("visibilitychange",()=>{if(document.hidden){stop();if(S){DB.cur=S;save()}}else if(CUR==="quiz"&&S&&$("#tmr"))startT()});
addEventListener("pagehide",()=>{stop();if(S){DB.cur=S;save()}});
function draw(){
 const q=BY[S.ids[S.i]],n=S.ids.length,d=S.ans[q.id]!==undefined;
 app.innerHTML=`<div class="qw"><div class="qh"><div class="r"><button class="xb" id="xq" aria-label="Exit">${ic("x")}</button><div class="mid">Question ${S.i+1} of ${n} · Score ${S.sc}</div><div class="tm" id="tmr"></div></div><div class="pb"><i style="width:${(S.i+(d?1:0))/n*100}%"></i></div></div>
 <div class="qc" id="qc"><div class="qm">Paper ${PN[q.p].split(" · ")[0]} · Q${q.n}</div><div class="qt">${esc(q.q)}</div>${q.o.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`).join("")}<div id="fb"></div></div>
 <div class="qf"><button class="btn gh" id="pv" ${S.i?"":"disabled"}>${ic("back")} Previous</button><button class="btn" id="nx">${S.i+1<n?"Next":"Finish"} ${ic("arrow")}</button></div></div>`;
 document.querySelectorAll(".op").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
 $("#pv").onclick=()=>{if(S.i>0){S.i--;DB.cur=S;save();draw()}};
 $("#nx").onclick=()=>{if(S.i+1<n){S.i++;DB.cur=S;save();draw()}else{const sk=S.ids.filter(id=>S.ans[id]===undefined).length;ask(sk?"You have "+sk+" unanswered question"+(sk>1?"s":"")+". Finish anyway?":"Finish the quiz and see your result?","Finish",finish,"Keep going")}};
 $("#xq").onclick=()=>ask("Save your progress and exit the quiz?","Save & exit",()=>{DB.cur=S;save();go("home")},"Keep going");
 tick();if(d)feedback(q,S.ans[q.id],true)}
function pick(i){const q=BY[S.ids[S.i]];if(S.ans[q.id]!==undefined)return;S.ans[q.id]=i;const h=DB.hist[q.id]=DB.hist[q.id]||{r:0,w:0};if(good(q,i)){S.sc++;h.r++}else h.w++;DB.cur=S;save();feedback(q,i)}
function refBox(q){return q.rs==="in"?`<div class="ref in">${ic("book",22)}<div><b>Found in the modules</b>Module ${q.rm.slice(1)} · ${MN[q.rm]}, page ${q.rp}</div></div>`:`<div class="ref none">${ic("info",22)}<div><b>Not stated directly in the modules</b>Answer is from general knowledge.</div></div>`}
function feedback(q,i,quiet){
 const g=good(q,i);
 document.querySelectorAll(".op").forEach((b,k)=>{b.disabled=true;if(q.c.includes(k))b.classList.add("right");else if(k===i)b.classList.add("wrong")});
 const best=q.c.map(k=>L[k]+") "+q.o[k]).join("  or  "),h=DB.hist[q.id]||{r:0,w:0};
 $("#fb").innerHTML=`<div class="fb"><div class="fh ${g?"ok":"no"}">${ic(g?"check":"xc",22)}${g?(q.c.includes(i)?"Correct!":"Accepted. Also valid; best answer below."):"Not quite. You chose "+L[i]+") "+esc(q.o[i])}</div><div class="fbd"><p><b>Answer:</b> ${esc(best)}</p>${refBox(q)}${q.note?`<p>${esc(q.note)}</p>`:""}<p><span class="tg">Your record: ✔ ${h.r} · ✘ ${h.w}</span></p></div></div>`;
 if(!quiet)setTimeout(()=>{const f=$("#fb");if(f)f.scrollIntoView({behavior:"smooth",block:"nearest"})},60)}
addEventListener("keydown",e=>{if(CUR!=="quiz"||!S||!$("#nx"))return;const q=BY[S.ids[S.i]],k=L.indexOf(e.key.toLowerCase());if(e.key.length===1&&k>=0&&k<q.o.length)pick(k);if(e.key==="ArrowRight")$("#nx").click();if(e.key==="ArrowLeft")$("#pv").click()});
function finish(){
 stop();const n=S.ids.length,miss=S.ids.filter(id=>S.ans[id]!==undefined&&!good(BY[id],S.ans[id])),mod={};
 S.ids.forEach(id=>{if(S.ans[id]===undefined)return;const q=BY[id],m=mod[q.rm]=mod[q.rm]||{r:0,t:0};m.t++;if(good(q,S.ans[id]))m.r++});
 LAST={name:S.name,sc:S.sc,n,el:S.el,miss,mod,skip:S.ids.filter(id=>S.ans[id]===undefined).length,skipIds:S.ids.filter(id=>S.ans[id]===undefined),up:S.lim&&S.el>=S.lim};
 DB.ses.push({name:S.name,sc:S.sc,n,el:S.el,d:new Date().toLocaleString()});DB.ses=DB.ses.slice(-30);DB.cur=null;S=null;save();go("result")}
function result(){
 if(!LAST)return go("home");const f=LAST,pc=Math.round(f.sc/f.n*100),ms=Object.entries(f.mod).sort((a,b)=>a[1].r/a[1].t-b[1].r/b[1].t);
 app.innerHTML=`<div class="qw"><div class="c"><div class="row" style="gap:20px"><div class="ring" style="--p:${pc}"><div>${pc}%</div></div><div><p class="mu" style="margin:0">${esc(f.name)}${f.up?" · time is up":""}</p><p class="big">${f.sc}<span class="mu" style="font-size:22px"> / ${f.n}</span></p><span class="tg">${ic("clock",14)} ${fmt(f.el)}</span>${f.skip?`<span class="tg t-amb">${f.skip} unanswered</span>`:""}</div></div>
 <div class="row" style="margin-top:14px"><button class="btn" id="rt" ${f.miss.length+f.skipIds.length?"":"disabled"}>${ic("refresh")} Retry ${f.miss.length+f.skipIds.length} missed or skipped</button><button class="btn gh" data-go="practice">New quiz</button><button class="btn gh" data-go="home">Home</button></div></div>
 <div class="c"><h2>Where to revise</h2>${ms.map(([k,v])=>{const p=Math.round(v.r/v.t*100);return `<div class="mrow"><b>${k||"—"}</b><div><div class="pb"><i style="width:${p}%"></i></div><span class="mu">${k?"Module "+k.slice(1)+" · ":""}${MN[k]}</span></div><span>${v.r}/${v.t}</span></div>`}).join("")}</div>
 ${f.miss.length?`<div class="c"><h2>Questions you missed</h2>${f.miss.map(id=>{const q=BY[id];return `<div class="kq"><b>${esc(q.q)}</b><br><span class="mu">Answer:</span> ${q.c.map(k=>L[k]+") "+esc(q.o[k])).join(" or ")}<br><span class="tg">${q.rs==="none"?"General knowledge":"Module "+q.rm.slice(1)+", page "+q.rp}</span>${q.note?`<br><span class="mu">${esc(q.note)}</span>`:""}</div>`}).join("")}</div>`:""}<p class="mu" style="text-align:center">ENT 312 Quiz by Basheer M. Mustapha</p></div>`;
 
 $("#rt").onclick=()=>{S={name:"Retry: "+f.name,ids:shuf(f.miss.concat(f.skipIds)),i:0,ans:{},sc:0,el:0,lim:0};DB.cur=S;save();go("quiz")}}
/* PROGRESS */
function progress(){
 const t=tot(),h=DB.hist,mods={};
 Object.keys(h).forEach(id=>{const q=BY[id];if(!q)return;const m=mods[q.rm]=mods[q.rm]||{r:0,w:0};m.r+=h[id].r;m.w+=h[id].w});
 const ms=Object.entries(mods).sort((a,b)=>a[1].r/(a[1].r+a[1].w)-b[1].r/(b[1].r+b[1].w));
 const weak=Object.keys(h).filter(k=>BY[k]&&h[k].w>0).sort((a,b)=>(h[b].w-h[b].r)-(h[a].w-h[a].r)).slice(0,8);
 const seen=Object.keys(h).filter(k=>BY[k]).length;
 app.innerHTML=`<h1>Your progress</h1><p class="sub">Saved on this device only.</p>
 <div class="g g4"><div class="c st"><div class="ic">${ic("doc")}</div><div><b>${t.t}</b><span>Attempts</span></div></div><div class="c st"><div class="ic" style="color:var(--ok)">${ic("check")}</div><div><b>${t.r}</b><span>Correct</span></div></div><div class="c st"><div class="ic" style="color:var(--no)">${ic("xc")}</div><div><b>${t.w}</b><span>Failed</span></div></div><div class="c st"><div class="ic" style="color:var(--gold)">${ic("target")}</div><div><b>${t.a}%</b><span>Accuracy</span></div></div></div>
 <div class="c"><h2>Coverage</h2><div class="pb" style="height:12px"><i style="width:${seen/280*100}%"></i></div><p class="mu">${seen} of 280 questions attempted</p></div>
 <div class="g g2 m1"><div class="c"><h2>Accuracy by module</h2>${ms.length?ms.map(([k,v])=>{const p=Math.round(v.r/(v.r+v.w)*100);return `<div class="mrow"><b>${k||"—"}</b><div><div class="pb"><i style="width:${p}%"></i></div><span class="mu">${k?"Module "+k.slice(1)+" · ":""}${MN[k]}</span></div><span>${p}%</span></div>`}).join(""):'<p class="mu">Answer some questions to see this.</p>'}</div>
 <div class="c"><h2>Most missed</h2>${weak.length?weak.map(id=>{const q=BY[id];return `<div class="kq"><span class="mu">Paper ${PN[q.p][0]} · Q${q.n}</span><br>${esc(q.q.slice(0,110))}${q.q.length>110?"…":""}<br><span class="tg t-amb">✘ ${h[id].w}</span><span class="tg t-ok">✔ ${h[id].r}</span></div>`}).join(""):'<p class="mu">Nothing missed yet.</p>'}</div></div>
 <div class="c"><h2>Recent sessions</h2>${DB.ses.length?DB.ses.slice(-10).reverse().map(s=>{const p=Math.round(s.sc/s.n*100);return `<div class="kq row" style="justify-content:space-between"><div><b>${esc(s.name)}</b><br><span class="mu">${s.d} · ${fmt(s.el)}</span></div><span class="sc ${p>=50?"t-ok":"t-amb"}">${s.sc}/${s.n}</span></div>`}).join(""):'<p class="mu">No sessions yet.</p>'}</div>
 <button class="btn gh sm" id="rst">${ic("trash",16)} Reset my record</button>`;
 $("#rst").onclick=()=>ask("Erase all saved attempts and progress?","Erase",()=>{DB={hist:{},ses:[]};save();progress()},"Cancel")}
/* ANSWER KEY */
function keyPage(){
 app.innerHTML=`<div><h1>Answer key</h1></div><p class="sub">All 280 questions with their answers and module references.</p><div class="c">${D.map(q=>{const h=DB.hist[q.id];return `<div class="kq"><span class="mu">Paper ${PN[q.p][0]} · Q${q.n}</span><br>${esc(q.q)}<br><b style="color:var(--ok)">${ic("check",16)} ${q.c.map(k=>L[k]+") "+esc(q.o[k])).join(" or ")}</b><br><span class="tg ${q.rs==="in"?"t-ok":"t-gk_ok"}">${q.rs==="in"?"Found in the modules · Module "+q.rm.slice(1)+", page "+q.rp:"From general knowledge"}</span>${h?`<span class="tg">✔ ${h.r} · ✘ ${h.w}</span>`:""}${q.note?`<br><span class="mu">${esc(q.note)}</span>`:""}</div>`}).join("")}</div>`}
/* ABOUT */
function about(){
 const cnt=k=>D.filter(q=>q.rs==="in"&&q.rm===k).length,none=D.filter(q=>q.rs==="none").length,mx=Math.max(...["M1","M2","M3","M4","M5","M6","M7","M8"].map(cnt),none);
 app.innerHTML=`<div><h1>About</h1></div><p class="sub">ENT 312 · Venture Creation and Growth · Bayero University, Kano</p>
 <div class="c"><h2>What you see after each answer</h2><div class="ref in">${ic("book",22)}<div><b>Found in the modules</b>The answer is stated in, or can be worked out from, the modules. You get the module and page.</div></div><div class="ref none">${ic("info",22)}<div><b>Not stated directly in the modules</b>The answer is from general knowledge.</div></div></div>
 <div class="c"><h2>Where the answers are found</h2>${["M1","M2","M3","M4","M5","M6","M7","M8"].map(k=>{const n=cnt(k);return `<div class="mrow"><b>${k}</b><div><div class="pb"><i style="width:${n/mx*100}%"></i></div><span class="mu">${MN[k]}</span></div><span>${n}</span></div>`}).join("")}<div class="mrow"><b>—</b><div><div class="pb"><i style="width:${none/mx*100}%;background:var(--in)"></i></div><span class="mu">General knowledge</span></div><span>${none}</span></div><p class="mu">Modules 6 and 7 have no questions in these papers.</p></div>
 <div class="c"><h2>Credits</h2><p>Developed by <b>Basheer M. Mustapha</b>.<br>Past papers compiled by Ola of BUK, 58th SUG Treasurer. Answers checked against ENT 312 Modules 1–8.</p><button class="btn gh" id="shr">${ic("share")} Share this quiz</button></div>`;
 $("#shr").onclick=async()=>{try{if(navigator.share)await navigator.share({title:"ENT 312 Past Questions",url:location.href});else{await navigator.clipboard.writeText(location.href);toast("Link copied")}}catch(e){}}}
route();
</script></body></html>
